# Netlify: publica o app ARCELORMITTAL_PECEM_OCUPACAO a cada push na branch main do GitHub.
[build]
  base = "ARCELORMITTAL_PECEM_OCUPACAO"
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Service worker e manifest sempre atualizados (o app em si usa nomes com hash).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
