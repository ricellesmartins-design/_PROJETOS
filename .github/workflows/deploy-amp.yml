# Publica o app AMP_ATIVIDADES_FERIAS no GitHub Pages a cada push na branch main.
name: Publicar app AMP (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['AMP_ATIVIDADES_FERIAS/**', '.github/workflows/deploy-amp.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AMP_ATIVIDADES_FERIAS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AMP_ATIVIDADES_FERIAS/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: AMP_ATIVIDADES_FERIAS/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
